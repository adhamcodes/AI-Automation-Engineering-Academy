<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Automation Lab Form</title></head>
<body>
  <main class="page-shell">
    <h1>Customer Intake</h1>
    <form id="intake" class="intake-form">
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <button type="submit" class="primary-button">Create request</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.querySelector('#intake').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#result').textContent = 'Request created';
    });
  </script>
</body>
</html>
